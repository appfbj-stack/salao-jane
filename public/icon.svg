<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="40%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with subtle luxury rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Subtle decorative inner gold border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Center Salon / Aesthetic Silhouette & Crest -->
  <g filter="url(#shadow)" transform="translate(256, 235)">
    <!-- Scissor Blades with gold shimmer -->
    <path d="M-50 -100 L0 10 L50 -100" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="-65" cy="-115" r="24" stroke="url(#goldGrad)" stroke-width="10" fill="none" />
    <circle cx="65" cy="-115" r="24" stroke="url(#goldGrad)" stroke-width="10" fill="none" />
    <circle cx="0" cy="10" r="7" fill="url(#goldGrad)" />
    
    <!-- Aesthetic Sparkle Stars -->
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff" />
    <path d="M-80 50 Q-80 65 -65 65 Q-80 65 -80 80 Q-80 65 -95 65 Q-80 65 -80 50 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M85 45 Q85 60 100 60 Q85 60 85 75 Q85 60 70 60 Q85 60 85 45 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Stylized Crown / Floral Arch -->
    <path d="M-110 30 C-70 -20 70 -20 110 30 C70 90 -70 90 -110 30 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="6,4" opacity="0.7" />
    
    <!-- Beauty Mirror / Silhouette Heart base -->
    <path d="M0 45 C-40 45 -70 75 -70 105 C-70 145 0 185 0 185 C0 185 70 145 70 105 C70 75 40 45 0 45 Z" fill="#ffffff" fill-opacity="0.15" stroke="url(#goldGrad)" stroke-width="6" />
  </g>

  <!-- Typography: STUDIO BELLA -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">STUDIO BELLA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">SALÃO &amp; ESTÉTICA</text>
</svg>
